<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PhilSLA.ExamPlatform.Proctor</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="PhilSLA.ExamPlatform.Proctor.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.philslaAttendanceDialog = (() => {
            const focusableSelector = [
                "button:not([disabled])",
                "input:not([disabled])",
                "textarea:not([disabled])",
                "select:not([disabled])",
                "a[href]",
                "[tabindex]:not([tabindex='-1'])"
            ].join(",");
            let dialog;
            let trigger;
            let triggerId;

            const focusableElements = () =>
                dialog ? Array.from(dialog.querySelectorAll(focusableSelector)) : [];

            const trapFocus = event => {
                if (event.key !== "Tab") {
                    return;
                }

                const elements = focusableElements();
                if (elements.length === 0) {
                    event.preventDefault();
                    return;
                }

                const first = elements[0];
                const last = elements[elements.length - 1];
                if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
                    event.preventDefault();
                    first.focus();
                }
            };

            const releaseDialog = () => {
                dialog?.removeEventListener("keydown", trapFocus);
                dialog = undefined;
            };

            return {
                open(element) {
                    trigger = document.activeElement;
                    triggerId = trigger?.id;
                    dialog = element;
                    dialog.addEventListener("keydown", trapFocus);
                    (dialog.querySelector("[autofocus]") ?? focusableElements()[0])?.focus();
                },
                close() {
                    releaseDialog();
                    requestAnimationFrame(() => {
                        const target = trigger?.isConnected
                            ? trigger
                            : triggerId ? document.getElementById(triggerId) : undefined;
                        target?.focus();
                        trigger = undefined;
                        triggerId = undefined;
                    });
                },
                closeTo(targetId) {
                    releaseDialog();
                    trigger = undefined;
                    triggerId = undefined;
                    requestAnimationFrame(() => {
                        document.getElementById(targetId)?.focus();
                    });
                }
            };
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
